<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Julius Remodeling Group</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--night:#0b0a09;--paper:#f2f0eb;--gold:#d6b874;--muted:#9a9488;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font:400 17px/1.6 "Geist",system-ui,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
.mono{font:500 11.5px "Geist Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font:400 clamp(64px,12vw,160px)/.9 "Instrument Serif",Georgia,serif;letter-spacing:-.03em;margin:20px 0}
h1 em{color:var(--gold)}
p{color:var(--muted);max-width:28em;margin:0 auto 36px}
a.btn{display:inline-flex;gap:12px;align-items:center;background:var(--gold);color:var(--night);text-decoration:none;font-weight:500;padding:16px 26px;border-radius:999px}
a.btn:hover{background:#e6cc8f}
a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
</style>
</head>
<body>
<main>
  <p class="mono">Sheet not found · 404</p>
  <h1>This room <em>isn't built.</em></h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a class="btn" href="/">Back to the homepage →</a>
</main>
</body>
</html>
